name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check

  # Security: production dependency audit blocks on high+ (2026-08-02, B4 整改——
  # known transitive vulns resolved via brace-expansion override, audit shows 0 high).
  # SAST (semgrep) blocks (2026-08-02, FINAL_LAUNCH_AUDIT P2)：不再静默忽略；
  # 若上游 auto config 产生误报，显式排除具体规则，禁止 continue-on-error。
  security:
    name: Dependency audit · SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: SAST (semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
