name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Security: production dependency audit blocks on high+ (2026-08-02, B4 整改——
  # known transitive vulns resolved via brace-expansion override, audit shows 0 high).
  # SAST (semgrep) stays informational: upstream auto config may flag false positives;
  # re-evaluate to blocking after first clean run.
  security:
    name: Dependency audit · SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: SAST (semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true
